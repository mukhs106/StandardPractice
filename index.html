<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standard Practice / Office for Exceptions</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Every visible string is written into these regions from copy.js by app.js. -->
  <header class="header" id="header"></header>

  <div class="layout">
    <aside class="case-info" id="case-info"></aside>

    <main class="workspace" id="workspace">
      <section class="active" id="active"></section>
      <section class="case-index" id="case-index" hidden></section>
      <section class="panel" id="panel" hidden></section>
    </main>

    <aside class="margin" id="margin"></aside>
  </div>

  <div class="visually-hidden" id="status" role="status" aria-live="polite"></div>

  <!-- Print only: every issued document. -->
  <section class="print-record" id="print-record"></section>

  <!-- The nine calibration specimens. Labels are in copy.js, keyed by data-specimen. -->
  <template id="specimens">
    <!-- Book title page -->
    <svg data-specimen="title-page" viewBox="0 0 120 120" aria-hidden="true">
      <g font-family="Georgia, serif" text-anchor="middle" fill="#000">
        <text x="60" y="44" font-size="11">A Short History</text>
        <text x="60" y="58" font-size="11">of Type</text>
        <text x="60" y="72" font-size="5.5" font-style="italic">Second edition</text>
        <text x="60" y="102" font-size="4.6">London</text>
      </g>
      <line x1="52" y1="84" x2="68" y2="84" stroke="#000" stroke-width=".5"/>
    </svg>

    <!-- Company logo -->
    <svg data-specimen="logo" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="50" r="22" fill="#000"/>
      <rect x="60" y="28" width="22" height="22" fill="#fff"/>
      <text x="60" y="94" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#000">Northline</text>
    </svg>

    <!-- Railway timetable -->
    <svg data-specimen="timetable" viewBox="0 0 120 120" aria-hidden="true">
      <g font-family="Inter, sans-serif" font-size="6.5" fill="#000">
        <text x="14" y="36" font-weight="500">Station</text>
        <text x="106" y="36" font-weight="500" text-anchor="end">Departs</text>
        <text x="14" y="52">Central</text><text x="106" y="52" text-anchor="end">08:14</text>
        <text x="14" y="68">Riverside</text><text x="106" y="68" text-anchor="end">08:22</text>
        <text x="14" y="84">Northgate</text><text x="106" y="84" text-anchor="end">08:31</text>
      </g>
      <g stroke="#000">
        <line x1="14" y1="41" x2="106" y2="41" stroke-width=".75"/>
        <line x1="14" y1="57" x2="106" y2="57" stroke-width=".35"/>
        <line x1="14" y1="73" x2="106" y2="73" stroke-width=".35"/>
        <line x1="14" y1="89" x2="106" y2="89" stroke-width=".75"/>
      </g>
    </svg>

    <!-- Website landing page -->
    <svg data-specimen="landing-page" viewBox="0 0 120 120" aria-hidden="true">
      <rect width="120" height="120" fill="#000"/>
      <g font-family="Inter, sans-serif" fill="#fff">
        <text x="14" y="50" font-size="11" font-weight="500">Build without</text>
        <text x="14" y="63" font-size="11" font-weight="500">limits.</text>
        <text x="14" y="75" font-size="5.2">Everything you need, in one place.</text>
      </g>
      <rect x="14" y="84" width="42" height="13" fill="#fff"/>
      <text x="35" y="92.6" text-anchor="middle" font-family="Inter, sans-serif" font-size="5.2" font-weight="500" fill="#000">Get started</text>
    </svg>

    <!-- Typographic poster on a visible grid -->
    <svg data-specimen="poster" viewBox="0 0 120 120" aria-hidden="true">
      <g stroke="#000" stroke-width=".3">
        <line x1="10" y1="0" x2="10" y2="120"/>
        <line x1="70" y1="0" x2="70" y2="120"/>
        <line x1="0" y1="96" x2="120" y2="96"/>
      </g>
      <rect x="10" y="14" width="60" height="7" fill="#000"/>
      <g font-family="Inter, sans-serif" fill="#000">
        <text x="11" y="42" font-size="14" font-weight="500">Form</text>
        <text x="11" y="56" font-size="14" font-weight="500">follows</text>
        <text x="73" y="44" font-size="4.6">Zurich</text>
        <text x="73" y="50" font-size="4.6">Basel</text>
        <text x="12" y="106" font-size="4.6">03</text>
        <text x="73" y="106" font-size="4.6">Exhibition</text>
      </g>
    </svg>

    <!-- Magazine spread -->
    <svg data-specimen="magazine" viewBox="0 0 120 120" aria-hidden="true">
      <rect x="12" y="24" width="46" height="72" fill="#000"/>
      <text x="64" y="36" font-family="Georgia, serif" font-size="10" fill="#000">Quiet</text>
      <text x="64" y="47" font-family="Georgia, serif" font-size="10" fill="#000">rooms</text>
      <g stroke="#000" stroke-width=".6">
        <line x1="64" y1="58" x2="108" y2="58"/>
        <line x1="64" y1="63" x2="108" y2="63"/>
        <line x1="64" y1="68" x2="108" y2="68"/>
        <line x1="64" y1="73" x2="108" y2="73"/>
        <line x1="64" y1="78" x2="108" y2="78"/>
        <line x1="64" y1="83" x2="108" y2="83"/>
        <line x1="64" y1="88" x2="108" y2="88"/>
        <line x1="64" y1="93" x2="92" y2="93"/>
      </g>
    </svg>

    <!-- Chair -->
    <svg data-specimen="chair" viewBox="0 0 120 120" aria-hidden="true">
      <g fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M42 22v74"/>
        <path d="M42 66h38"/>
        <path d="M80 66v30"/>
        <path d="M42 30h14"/>
        <path d="M42 42h14"/>
      </g>
    </svg>

    <!-- Phone app screen -->
    <svg data-specimen="app-screen" viewBox="0 0 120 120" aria-hidden="true">
      <rect x="38" y="12" width="44" height="96" fill="#fff" stroke="#000" stroke-width="1"/>
      <text x="43" y="26" font-family="Inter, sans-serif" font-size="6" font-weight="500" fill="#000">Today</text>
      <g fill="#000">
        <rect x="43" y="33" width="8" height="8"/>
        <rect x="43" y="47" width="8" height="8"/>
        <rect x="43" y="61" width="8" height="8"/>
        <rect x="43" y="92" width="34" height="9"/>
      </g>
      <g stroke="#000" stroke-width=".7">
        <line x1="55" y1="37" x2="77" y2="37"/>
        <line x1="55" y1="51" x2="77" y2="51"/>
        <line x1="55" y1="65" x2="72" y2="65"/>
      </g>
    </svg>

    <!-- Wayfinding sign -->
    <svg data-specimen="sign" viewBox="0 0 120 120" aria-hidden="true">
      <rect x="20" y="34" width="80" height="52" fill="#000"/>
      <path d="M32 60h24M46 50l10 10-10 10" fill="none" stroke="#fff" stroke-width="3.4"/>
      <text x="64" y="58" font-family="Inter, sans-serif" font-size="7" font-weight="500" fill="#fff">Platform</text>
      <text x="64" y="68" font-family="Inter, sans-serif" font-size="7" font-weight="500" fill="#fff">1-4</text>
    </svg>
  </template>
</body>
</html>
